<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Acceso | Pokémon Bank</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" />
        <link rel="stylesheet" href="css/styles.css" />
    </head>
    <body>
        <header class="top">
            <div class="brand">Pokémon <span>Bank</span></div>
            <a class="btn light" href="index.html">Salir / Inicio</a>
        </header>
        <main class="wrap">
            <section class="panel center">
                <h1>Bienvenido</h1>
                <p class="muted">Ingresa tu PIN para acceder al cajero.</p>
                <label for="pin">PIN (4 dígitos)</label
                ><input
                    id="pin"
                    type="password"
                    inputmode="numeric"
                    pattern="[0-9]{4}"
                    maxlength="4"
                    placeholder="••••"
                />
                <p class="muted">Vista de demostración: el acceso aún no valida el PIN.</p>
                <a class="btn" href="acciones.html">Ingresar (demo)</a>
            </section>
        </main>
        <footer class="footer">Proyecto académico · Prototipo visual sin transacciones reales</footer>
    </body>
</html>
