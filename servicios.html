<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Servicios | Pokémon Bank</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" />
        <link rel="stylesheet" href="css/styles.css" />
    </head>
    <body>
        <header class="top">
            <div class="brand">🔴 Pokémon <span>Bank</span></div>
            <a class="btn light" href="index.html">Salir / Inicio</a>
        </header>
        <main class="wrap">
            <section class="panel">
                <h1>Pago de servicios</h1>
                <p class="muted">Selección visual; no se ejecutan pagos.</p>
                <label for="tipo">Servicio</label
                ><select id="tipo">
                    <option>Energía eléctrica</option>
                    <option>Internet</option>
                    <option>Telefonía</option>
                    <option>Agua potable</option></select
                ><label for="ref">Referencia o contrato</label
                ><input id="ref" placeholder="Número de referencia" /><label for="valor">Monto (USD)</label
                ><input id="valor" type="number" min="0.01" step="0.01" placeholder="0.00" /><a
                    class="btn"
                    href="acciones.html"
                    >Continuar (demo)</a
                >
            </section>
        </main>
        <footer class="footer">Proyecto académico · Prototipo visual sin transacciones reales</footer>
    </body>
</html>
